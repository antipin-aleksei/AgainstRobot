name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Standard hosted macOS is free for public repositories. Never run privately.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record tools and select an available iPhone
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcodebuild -showsdks
            git rev-parse HEAD
          } 2>&1 | tee build/ci/environment.log
          xcrun simctl list --json > build/ci/simulators.json
          xcrun --sdk iphonesimulator --show-sdk-version > build/ci/sdk-version.txt
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/ci")
          inventory = json.loads((root / "simulators.json").read_text())
          sdk_major = int((root / "sdk-version.txt").read_text().split(".")[0])
          candidates = []
          for runtime in inventory["runtimes"]:
              if not runtime.get("isAvailable") or not runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              version = tuple(map(int, runtime["version"].split(".")))
              if version[0] != sdk_major or version[0] < 17:
                  continue
              for device in inventory["devices"].get(runtime["identifier"], []):
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"] == "iPhone 16", device["name"], device["udid"], runtime, device))
          if not candidates:
              raise SystemExit("No available iPhone runtime matching the selected Xcode SDK major (iOS 17+) found")
          *_, runtime, device = max(candidates, key=lambda item: item[:4])
          destination = f"platform=iOS Simulator,id={device['udid']}"
          selected = {"name": device["name"], "runtime": runtime["name"], "destination": destination}
          (root / "destination.json").write_text(json.dumps(selected, indent=2) + "\n")
          print(json.dumps(selected, indent=2))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"DESTINATION={destination}\n")
              output.write(f"SIMULATOR_UDID={device['udid']}\n")
              output.write(f"SIMULATOR_STATE={device['state']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"### Simulator\n{device['name']} / {runtime['name']}\n\n`{destination}`\n")
          PY

      - name: Boot simulator and wait for readiness
        run: |
          set -euo pipefail
          {
            if [[ "$SIMULATOR_STATE" != Booted ]]; then
              xcrun simctl boot "$SIMULATOR_UDID"
            fi
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          } 2>&1 | tee build/ci/simulator-boot.log

      - name: Build Debug for testing
        run: |
          set -euo pipefail
          xcodebuild -project AgainstRobot.xcodeproj -scheme AgainstRobot \
            -configuration Debug -sdk iphonesimulator -destination "$DESTINATION" \
            -destination-timeout 60 -derivedDataPath build/DerivedData \
            -resultBundlePath build/ci/DebugBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee build/ci/debug-build.log

      - name: Run UI smoke tests
        run: |
          set -euo pipefail
          xcodebuild -project AgainstRobot.xcodeproj -scheme AgainstRobot \
            -configuration Debug -sdk iphonesimulator -destination "$DESTINATION" \
            -destination-timeout 60 -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ci/SmokeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test-without-building \
            2>&1 | tee build/ci/tests.log

      - name: Require completed tests
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path build/ci/SmokeTests.xcresult > build/ci/test-summary.json
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("build/ci/test-summary.json").read_text())
          passed = summary["passedTests"]
          failed = summary["failedTests"]
          if not isinstance(passed, int) or passed < 1 or failed != 0:
              raise SystemExit(f"Expected completed passing tests: passed={passed}, failed={failed}")
          message = f"UI tests: {passed} passed, {failed} failed."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"\n{message}\n")
          PY

      - name: Build Release for simulator
        run: |
          set -euo pipefail
          xcodebuild -project AgainstRobot.xcodeproj -scheme AgainstRobot \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ReleaseDerivedData \
            -resultBundlePath build/ci/ReleaseBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/ci/release-build.log

      - name: Export UI screenshot attachments
        if: always()
        run: |
          set -euo pipefail
          if [[ -d build/ci/SmokeTests.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/ci/SmokeTests.xcresult \
              --output-path build/ci/attachments
          fi

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
          retention-days: 7
